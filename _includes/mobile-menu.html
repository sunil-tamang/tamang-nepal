<dialog id="mobile-menu" aria-label="Explore TAMANG">
  <div class="mobile-menu-top"><a class="mobile-menu-brand" href="{{ '/' | relative_url }}" aria-label="TAMANG Nepal home"><img src="{{ '/assets/images/tamang-logo.svg' | relative_url }}" alt="TAMANG" width="602" height="151"></a><button id="close-menu" class="menu-close" autofocus>Close</button></div>
  <nav class="ref-mobile-links" aria-label="Mobile navigation">
    <a href="{{ '/collection/' | relative_url }}"{% if page.page_id == 'collection' or page.layout == 'product' or page.layout == 'reference-product' %} aria-current="page"{% endif %}>Shop</a>
    <a href="{{ '/materials/' | relative_url }}"{% if page.page_id == 'materials' %} aria-current="page"{% endif %}>Materials</a>
    <a href="{{ '/story/' | relative_url }}"{% if page.page_id == 'story' %} aria-current="page"{% endif %}>Our story</a>
  </nav>
  <div class="mobile-menu-actions"><a class="mobile-selection" href="{{ '/enquire/#saved-section' | relative_url }}">Your selection <span data-saved-count>0</span></a><a class="mobile-instagram" href="{{ site.data.instagram.profile_url }}" target="_blank" rel="noopener noreferrer">Instagram</a></div>
</dialog>
