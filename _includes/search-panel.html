<dialog id="header-search" class="search-popover" aria-label="Search the collection" data-collection-url="{{ '/collection/' | relative_url }}">
  <form class="search-popover-form" action="{{ '/collection/' | relative_url }}" method="get" role="search">
    <div class="search-popover-field"><svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 5 5"/></svg><label class="sr-only" for="header-search-input">Search products</label><input id="header-search-input" type="search" name="q" placeholder="Search products" autocomplete="off" spellcheck="false" role="combobox" aria-autocomplete="list" aria-expanded="false" aria-controls="search-suggestions" autofocus><button class="search-clear" id="search-clear" type="button" aria-label="Clear search" hidden><svg viewBox="0 0 20 20" fill="none" aria-hidden="true"><path d="m5 5 10 10M15 5 5 15"/></svg></button></div>
    <button id="header-search-close" class="search-cancel" type="button">Cancel</button>
  </form>
  <div class="search-popover-body"><aside class="search-sidebar"><section><h2 class="search-section-label" id="search-suggestions-title">Suggestions</h2><ul id="search-suggestions" role="listbox" aria-labelledby="search-suggestions-title"></ul></section><nav class="search-browse" aria-labelledby="search-browse-title"><h2 class="search-section-label" id="search-browse-title">Browse by</h2><a href="{{ '/collection/' | relative_url }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14l1 14H4L5 7Zm3 1V5a4 4 0 0 1 8 0v3"/></svg>All products</a><a href="{{ '/materials/' | relative_url }}"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 3h14v18H5zM9 3v18m4-14h3m-3 5h3m-3 5h3"/></svg>Materials</a><a href="{{ '/story/' | relative_url }}"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 10v7m0-10v1"/></svg>Our story</a></nav></aside><section class="search-results" aria-labelledby="search-results-title"><h2 class="search-section-label" id="search-results-title">Matching products</h2><p class="sr-only" id="search-result-status" role="status" aria-live="polite" aria-atomic="true"></p><div class="search-product-grid" id="search-product-grid"></div><p class="search-empty" id="search-empty" hidden>No matching products. Try another name or browse all products.</p><a class="search-all-results" id="search-all-results" href="{{ '/collection/' | relative_url }}">View all results</a></section></div>
</dialog>
<script type="application/json" id="search-catalogue-data">[{% assign search_order = 'tote-bag,jutta-bag,shoe-bag,glider-pouch,tent-pouch,poncho-pouch' | split: ',' %}{% for slug in search_order %}{% assign product = site.data.reference_products | where: 'slug', slug | first %}{% assign card = site.data.collection_cards | where: 'slug', slug | first %}{"title":{{ product.title | jsonify }},"url":{{ product.url | relative_url | jsonify }},"image":{{ card.image | relative_url | jsonify }},"alt":{{ product.image_alt | jsonify }},"description":{{ card.description | jsonify }},"tags":{{ card.tags | jsonify }}}{% unless forloop.last %},{% endunless %}{% endfor %}]</script>
