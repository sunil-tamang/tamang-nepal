{% assign piece = site.data.reference_products | where: 'slug', include.card.slug | first %}
<article class="collection-card" data-ref-card data-category="{{ include.card.category }}" data-ref-material="{{ include.card.materials }}" data-number="{{ include.card.number }}" data-name="{{ piece.title }}">
  <a class="collection-card-link" href="{{ piece.url | relative_url }}" aria-labelledby="collection-title-{{ piece.slug }}">
    <img src="{{ include.card.image | relative_url }}" alt="{{ piece.image_alt | escape }}" width="640" height="768" {% if include.card.number > 4 %}loading="lazy"{% endif %}>
    <span class="collection-number" aria-hidden="true">0{{ include.card.number }}</span>
    <div class="collection-card-copy"><h2 id="collection-title-{{ piece.slug }}">{{ piece.title }}</h2><p>{{ include.card.description }}</p><div class="collection-tags">{% for tag in include.card.tags %}<span>{{ tag }}</span>{% endfor %}</div><span class="collection-open" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M5 12h14m-6-6 6 6-6 6"/></svg></span></div>
  </a>
  <button class="collection-bookmark" data-save="{{ piece.slug }}" aria-pressed="false" aria-label="Save {{ piece.title }} to selection"><svg viewBox="0 0 20 24" aria-hidden="true"><path d="M4 2h12a1 1 0 0 1 1 1v18l-7-5-7 5V3a1 1 0 0 1 1-1Z"/></svg></button>
</article>
