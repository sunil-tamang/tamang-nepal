{% assign piece = site.data.reference_products | where: 'slug', include.card.slug | first %}
<article class="home-piece{% if include.card.number == 1 %} home-piece--feature{% endif %}"><a class="home-piece-link" href="{{ piece.url | relative_url }}" aria-labelledby="home-piece-{{ piece.slug }}"><img class="home-piece-photo" src="{{ include.card.image | relative_url }}" alt="{{ piece.image_alt | escape }}" width="800" height="1000" loading="lazy"><span class="home-piece-number" aria-hidden="true">0{{ include.card.number }}</span><div class="home-piece-copy"><h3 id="home-piece-{{ piece.slug }}">{{ piece.title }}</h3><p>{{ include.card.description }}</p><span class="home-piece-arrow" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M4 12h16m-7-7 7 7-7 7"/></svg></span><ul class="home-piece-materials">{% for tag in include.card.tags %}<li>{% include piece-material-icon.html label=tag %}<span>{{ tag }}</span></li>{% endfor %}</ul></div></a></article>
